name: publish to npm

# 触发：推送任意 v* 标签（例如 git tag v0.1.1 && git push --tags）
#
# 采用 npm Trusted Publishing（OIDC）：不需要 NPM_TOKEN secret。
# npm CLI 的自动 OIDC 检测在部分情况下不生效（会静默退回、报 ENEEDAUTH），
# 所以这里手动执行 npm 内部同一套 OIDC 交换：
#   1) 从 GitHub 取 ID token（audience = npm:registry.npmjs.org）
#   2) 在 npm 注册中心按包交换成短时发布 token
#   3) 写入 .npmrc 后 npm publish
# 失败时错误原样暴露（不吞掉），便于排查。
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish @dsh-toolbox/core
        working-directory: packages/core
        run: |
          set -euo pipefail
          echo "OIDC URL set: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          test -n "$ID_TOKEN" -a "$ID_TOKEN" != "null" || { echo "ID token fetch failed"; exit 1; }
          REG_TOKEN=$(curl -sS -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@dsh-toolbox%2fcore" -H "Authorization: Bearer $ID_TOKEN" | jq -r .token)
          test -n "$REG_TOKEN" -a "$REG_TOKEN" != "null" || { echo "OIDC exchange failed"; exit 1; }
          npm config set //registry.npmjs.org/:_authToken="$REG_TOKEN"
          npm publish --access public
      - name: Publish @dsh-toolbox/session-care
        working-directory: packages/session-care
        run: |
          set -euo pipefail
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          REG_TOKEN=$(curl -sS -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@dsh-toolbox%2fsession-care" -H "Authorization: Bearer $ID_TOKEN" | jq -r .token)
          npm config set //registry.npmjs.org/:_authToken="$REG_TOKEN"
          npm publish --access public
      - name: Publish @dsh-toolbox/harness-patch
        working-directory: packages/harness-patch
        run: |
          set -euo pipefail
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          REG_TOKEN=$(curl -sS -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@dsh-toolbox%2fharness-patch" -H "Authorization: Bearer $ID_TOKEN" | jq -r .token)
          npm config set //registry.npmjs.org/:_authToken="$REG_TOKEN"
          npm publish --access public
